services:
  web:
    build:
      context: .
      args:
        VITE_APP_NAME: React Vite Best Practices
        VITE_API_BASE_URL: https://jsonplaceholder.typicode.com
        VITE_DUMMYJSON_API_BASE_URL: https://dummyjson.com
        VITE_FEATURE_MOCK_POSTS_API: 'false'
    ports:
      - '8080:80'
    restart: unless-stopped
